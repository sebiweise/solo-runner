name: Feature request
description: Suggest a change or a new option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why it does not work today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How solo-runner could solve it. Config options, behaviour, examples.
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: |
        Would this widen what a job can reach (mounts, capabilities, tokens,
        defaults)? If yes, how should it be documented or limited?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other tools you considered.
