version: 2
updates:
  # The runner base image. A merged bump is released as a new patch version
  # by workflows/auto-release.yml, so check daily.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "deps(runner)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(ci)"
