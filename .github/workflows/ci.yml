name: CI

on:
  pull_request:
  push:
    branches: [main]
  # update-tools.yml starts CI this way: its pull requests start no workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install --only-binary ":all:" ruff==0.17.5
      - run: ruff check .
      - run: ruff format --check .
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is the oldest supported; 3.12 is what the image ships.
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --only-binary ":all:" pytest==9.2.0
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: solo-runner:ci
          build-args: VERSION=ci
      - name: Smoke test
        run: |
          # Without a token it must refuse to start, with a clear message.
          set +e
          out=$(docker run --rm solo-runner:ci 2>&1); code=$?
          set -e
          echo "$out"
          [ "$code" -eq 2 ] && echo "$out" | grep -q "GITHUB_TOKEN"
          # The runner and the dispatcher are where the entrypoint expects them.
          docker run --rm --entrypoint sh solo-runner:ci -c \
            'test -x /home/runner/run.sh && docker compose version && gh --version && python3 -c "import solo_runner.dispatcher" && id -u'
      # Report only: nearly all findings are in the upstream runner image
      # (its bundled Node and .NET packages), which only a newer runner
      # release fixes; Dependabot picks that up daily.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: solo-runner:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
