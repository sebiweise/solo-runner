name: Release

# A tag vX.Y.Z builds and publishes ghcr.io/<owner>/solo-runner for amd64 and
# arm64, signs it with cosign (keyless) and creates the GitHub release.
# auto-release.yml calls this workflow for runner bumps.
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      version:
        description: Version without the leading v, e.g. 0.1.3
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v, e.g. 0.1.3
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write # cosign keyless signing

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        run: |
          version="${VERSION#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "not a version: $version" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```
            Digest: `${{ steps.build.outputs.digest }}`
