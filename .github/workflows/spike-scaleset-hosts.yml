name: Spike scale sets, two hosts

# Runs scripts/spike_scaleset_hosts.py against the end-to-end test repo (up to
# about 40 minutes): two scale sets with the same labels, as two hosts would
# have. Results go into docs/proposals/runner-scale-sets.md.
on:
  pull_request:
    paths:
      - scripts/spike_scaleset_hosts.py
      - .github/workflows/spike-scaleset-hosts.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - name: Spike
        env:
          GH_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
          E2E_REPO: ${{ vars.E2E_REPO || format('{0}/solo-runner-e2e', github.repository_owner) }}
          NAME: spike-h-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::E2E_GITHUB_TOKEN not available, spike skipped"; exit 0; fi
          python3 scripts/spike_scaleset_hosts.py
      - name: Runner logs
        if: always()
        run: tail -n 15 runner-*.log 2>/dev/null || true
