name: Update compose plugin

# Dependabot only sees the FROM line, not the docker compose plugin the
# Dockerfile downloads, so this does the same for it: look for a new release
# every day and open a pull request with the version and checksums. A merged
# bump is released as the next patch version by auto-release.yml.
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-compose

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the branch
      pull-requests: write # open the pull request, close superseded ones
      actions: write # start CI on the branch (see below)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_compose.py >> "$GITHUB_OUTPUT"
      - name: Pull request
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="deps/compose-v${VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            # Delete the branch to have it opened again.
            echo "$branch already exists, nothing to do"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "deps(compose): bump docker compose plugin from ${PREVIOUS} to ${VERSION}"
          git push origin "$branch"

          url=$(gh pr create --base main --head "$branch" \
            --title "deps(compose): bump docker compose plugin from ${PREVIOUS} to ${VERSION}" \
            --body "Bumps the docker compose plugin in the image from ${PREVIOUS} to ${VERSION}, with the checksums from the release's \`.sha256\` files.

          Release notes: https://github.com/docker/compose/releases/tag/v${VERSION}

          Merging releases the image as the next patch version (auto-release.yml).

          _Opened by update-compose.yml._")
          echo "opened $url"

          # Pull requests and pushes made with GITHUB_TOKEN start no workflows,
          # workflow_dispatch is the exception. The CI checks land on the same
          # commit, so they show up on the pull request.
          gh workflow run ci.yml --ref "$branch"

          # Like Dependabot: an older bump that is still open is superseded.
          gh pr list --state open --base main --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"deps/compose-v\")) | select(.headRefName != \"$branch\") | .number" |
          while read -r number; do
            gh pr close "$number" --delete-branch --comment "Superseded by $url."
          done
