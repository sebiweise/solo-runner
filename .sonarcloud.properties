# Settings for SonarCloud's automatic analysis.

# The dispatcher supports Python 3.10 and later (pyproject.toml, CI matrix).
sonar.python.version=3.10, 3.11, 3.12, 3.13

# Without these, SonarCloud guesses which files are tests and skips the rules
# for production code on them. Tests are excluded from the sources so no file
# is indexed twice.
sonar.sources=.
sonar.exclusions=tests/**
sonar.tests=tests
